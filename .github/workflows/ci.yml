name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.6.2-stable

jobs:
  # The suite spread over eight machines (tests/run_tests.gd --shard: each test dealt out by its time in
  # tests/test_times.json), and the multiplayer pairs over three, all at once: about six minutes where it was fifty.
  test:
    name: test (${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Run tests
        run: stdbuf -oL -eL godot --headless --fixed-fps 120 --path . res://tests/test_runner.tscn -- --shard=${{ matrix.shard }}/8 --times-out="$PWD/times-${{ matrix.shard }}.json"
      - name: Keep the tests' times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-times-${{ matrix.shard }}
          path: times-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: ignore

  multiplayer:
    name: multiplayer (${{ matrix.pairs }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pairs: ["mp_test mp_adventure mp_wrench mp_needs", "mp_police mp_dest mp_diary", "mp_bikers mp_real mp_journey"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Multiplayer test
        run: tests/mp_test.sh ${{ matrix.pairs }}

  # The Windows build alongside the tests rather than after them (a build of a red head is just not used).
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and Windows export template
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -sSLo templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt -d "$TEMPLATE_DIR"
          rm templates.tpz
      - name: Export Windows build
        run: |
          godot --headless --path . --import || true
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/TorqueShed.exe
      - name: Check the build holds the land's tiles
        run: |
          # (an export only takes the files its include filters name: a build once shipped without them, and every real road came out flat)
          for p in data/regions/shodoshima/tiles/ data/regions/shodoshima/ridge/ data/regions/dales/tiles/; do
            n=$(grep -a -o "$p" build/windows/TorqueShed.exe | wc -l)
            echo "$p: $n"
            test "$n" -gt 0
          done
      - uses: actions/upload-artifact@v4
        with:
          name: TorqueShed-windows
          path: build/windows/TorqueShed.exe
